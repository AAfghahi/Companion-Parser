<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Tournament Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border: #e0e0e0;
            --accent: #6366f1;
            --success: #10b981;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --text-primary: #ffffff;
                --text-secondary: #b0b0b0;
                --border: #404040;
                --accent: #818cf8;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .filter-section {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-section label {
            display: inline-block;
            margin: 0;
            font-weight: 500;
        }

        .filter-section select {
            flex: 1;
            min-width: 150px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1em;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--accent);
        }

        tr:hover {
            background: var(--bg-primary);
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
        }

        .stat-label {
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .pagination-controls button {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.95em;
        }

        .pagination-controls button:hover:not(:disabled) {
            background-color: var(--accent);
            color: white;
        }

        .pagination-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧙‍♂️ MTG Tournament Tracker</h1>
            <p class="subtitle">Magic: The Gathering standings powered by Google Sheets</p>
        </header>

        <div class="filter-section">
            <label for="weekFilter">Filter by Week:</label>
            <select id="weekFilter">
                <option value="">All Weeks (Totals)</option>
            </select>
            <label for="searchPlayer">Search Player:</label>
            <input type="text" id="searchPlayer" placeholder="Enter player name...">
        </div>

        <h2>Leaderboard</h2>
        <div class="table-container">
            <table id="leaderboard">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player Name</th>
                        <th>Total Points</th>
                        <th>Tournaments</th>
                        <th>Avg Points</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="pagination-controls" style="text-align: center; margin: 20px 0; display: none;" id="paginationControls">
            <button id="prevPage">← Previous</button>
            <span id="pageInfo" style="margin: 0 15px; font-weight: bold;"></span>
            <button id="nextPage">Next →</button>
        </div>

        <h2>Top Performers</h2>
        <div class="table-container">
            <table id="topPerformers">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Total Points</th>
                        <th>Tournaments</th>
                        <th>Avg Points</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="stat-card">
            <div class="stat-label">Data Statistics</div>
            <div style="margin-top: 10px;">
                <p>Total Entries: <span id="totalEntries">0</span></p>
                <p>Unique Players: <span id="uniquePlayers">0</span></p>
                <p>Weeks Tracked: <span id="weeksTracked">0</span></p>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiVH_4CPYMiKyL5CBrvLWk40flxccReKSt6q9ClZcN2xztAn_6IrCn6wIEwjArPgnlZQ/exec';

        function formatDate(dateValue) {
            if (!dateValue) return '';

            // If it's already in M/D/YY format, return as-is
            if (typeof dateValue === 'string' && /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(dateValue)) {
                return dateValue;
            }

            // If it's an ISO string or timestamp, parse it
            let date;
            if (typeof dateValue === 'string' && dateValue.includes('T')) {
                date = new Date(dateValue);
            } else if (typeof dateValue === 'number') {
                date = new Date(dateValue);
            } else if (dateValue instanceof Date) {
                date = dateValue;
            } else {
                return String(dateValue);
            }

            if (isNaN(date.getTime())) return String(dateValue);

            const month = date.getMonth() + 1;
            const day = date.getDate();
            const year = date.getFullYear().toString().slice(-2);
            return `${month}/${day}/${year}`;
        }

        let allRowsData = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        async function loadData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const rows = await response.json();
                allRowsData = rows;
                renderDashboard();
                populateFilters(rows);
                updateStatistics(rows);
            } catch (error) {
                console.error('Error loading data:', error);
                document.querySelector('#leaderboard tbody').innerHTML =
                    '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">Error loading data</td></tr>';
            }
        }

        function renderDashboard() {
            if (allRowsData.length <= 1) {
                document.querySelector('#leaderboard tbody').innerHTML =
                    '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No data yet</td></tr>';
                document.querySelector('#topPerformers tbody').innerHTML =
                    '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No data yet</td></tr>';
                return;
            }

            const weekFilter = document.getElementById('weekFilter').value;
            const searchTerm = document.getElementById('searchPlayer').value.toLowerCase();

            const playerStats = {};
            allRowsData.slice(1).forEach(row => {
                const name = row[0];
                const points = parseInt(row[2]) || 0;
                const week = row[3] || '';

                if (!playerStats[name]) {
                    playerStats[name] = { total: 0, count: 0, entries: [] };
                }
                playerStats[name].total += points;
                playerStats[name].count += 1;
                playerStats[name].entries.push({ points, week });
            });

            let leaderboardData = Object.entries(playerStats)
                .map(([name, stats]) => ({
                    name,
                    total: stats.total,
                    count: stats.count,
                    avg: Math.round(stats.total / stats.count),
                    entries: stats.entries
                }));

            if (weekFilter) {
                leaderboardData = leaderboardData.map(player => ({
                    ...player,
                    weekTotal: player.entries.filter(e => e.week === weekFilter).reduce((sum, e) => sum + e.points, 0),
                    weekCount: player.entries.filter(e => e.week === weekFilter).length
                })).filter(player => player.weekCount > 0)
                .sort((a, b) => b.weekTotal - a.weekTotal);
            } else {
                leaderboardData.sort((a, b) => b.total - a.total);
            }

            if (searchTerm) {
                leaderboardData = leaderboardData.filter(p => p.name.toLowerCase().includes(searchTerm));
            }

            currentPage = 1;
            renderLeaderboardPage(leaderboardData, weekFilter);
        }

        function renderLeaderboardPage(leaderboardData, weekFilter) {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = leaderboardData.slice(start, end);

            const tbody = document.querySelector('#leaderboard tbody');
            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No players found</td></tr>';
            } else {
                tbody.innerHTML = pageData.map((player, idx) => `
                    <tr>
                        <td>${start + idx + 1}</td>
                        <td>${player.name}</td>
                        <td><strong>${weekFilter ? player.weekTotal : player.total}</strong></td>
                        <td>${weekFilter ? player.weekCount : player.count}</td>
                        <td>${weekFilter ? (player.weekCount > 0 ? (player.weekTotal / player.weekCount).toFixed(1) : '0.0') : player.avg}</td>
                    </tr>
                `).join('');
            }

            const totalPages = Math.ceil(leaderboardData.length / itemsPerPage);
            const paginationControls = document.getElementById('paginationControls');

            if (leaderboardData.length > itemsPerPage) {
                paginationControls.style.display = 'block';
                document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
                document.getElementById('prevPage').disabled = currentPage === 1;
                document.getElementById('nextPage').disabled = currentPage === totalPages;
            } else {
                paginationControls.style.display = 'none';
            }

            renderTopPerformers(leaderboardData);
        }

        function renderTopPerformers(leaderboardData) {
            const topPerformers = leaderboardData.slice(0, 10);
            const topTbody = document.querySelector('#topPerformers tbody');

            if (topPerformers.length === 0) {
                topTbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No data yet</td></tr>';
            } else {
                topTbody.innerHTML = topPerformers.map((player, idx) => `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${player.name}</td>
                        <td><strong>${player.total}</strong></td>
                        <td>${player.count}</td>
                        <td>${player.avg}</td>
                    </tr>
                `).join('');
            }
        }

        function populateFilters(rows) {
            const weeks = new Set(rows.slice(1).map(r => r[3]).filter(Boolean));

            const weekSelect = document.getElementById('weekFilter');
            const currentWeek = weekSelect.value;
            weekSelect.innerHTML = '<option value="">All Weeks</option>' +
                Array.from(weeks).sort().reverse().map(w =>
                    `<option value="${w}">${formatDate(w)}</option>`
                ).join('');
            weekSelect.value = currentWeek;
        }

        function updateStatistics(rows) {
            const dataRows = rows.slice(1);
            const uniquePlayers = new Set(dataRows.map(r => r[0])).size;
            const weeks = new Set(dataRows.map(r => r[3])).size;

            document.getElementById('totalEntries').textContent = dataRows.length;
            document.getElementById('uniquePlayers').textContent = uniquePlayers;
            document.getElementById('weeksTracked').textContent = weeks;
        }

        document.getElementById('weekFilter').addEventListener('change', () => renderDashboard());
        document.getElementById('searchPlayer').addEventListener('input', () => renderDashboard());

        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderDashboard();
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            const weekFilter = document.getElementById('weekFilter').value;
            const searchTerm = document.getElementById('searchPlayer').value.toLowerCase();

            const playerStats = {};
            allRowsData.slice(1).forEach(row => {
                const name = row[0];
                const points = parseInt(row[2]) || 0;
                const week = row[3] || '';

                if (!playerStats[name]) {
                    playerStats[name] = { total: 0, count: 0, entries: [] };
                }
                playerStats[name].total += points;
                playerStats[name].count += 1;
                playerStats[name].entries.push({ points, week });
            });

            let leaderboardData = Object.entries(playerStats)
                .map(([name, stats]) => ({
                    name,
                    total: stats.total,
                    count: stats.count,
                    avg: Math.round(stats.total / stats.count),
                    entries: stats.entries
                }));

            if (weekFilter) {
                leaderboardData = leaderboardData.map(player => ({
                    ...player,
                    weekTotal: player.entries.filter(e => e.week === weekFilter).reduce((sum, e) => sum + e.points, 0),
                    weekCount: player.entries.filter(e => e.week === weekFilter).length
                })).filter(player => player.weekCount > 0);
            }

            if (searchTerm) {
                leaderboardData = leaderboardData.filter(p => p.name.toLowerCase().includes(searchTerm));
            }

            const totalPages = Math.ceil(leaderboardData.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderLeaderboardPage(leaderboardData, weekFilter);
            }
        });

        window.addEventListener('load', () => {
            loadData();
        });

        setInterval(() => {
            loadData();
        }, 30000);
    </script>
</body>
</html>
