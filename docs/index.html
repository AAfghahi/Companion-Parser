<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Tournament Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border: #e0e0e0;
            --accent: #6366f1;
            --success: #10b981;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --text-primary: #ffffff;
                --text-secondary: #b0b0b0;
                --border: #404040;
                --accent: #818cf8;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .filter-section {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-section label {
            display: inline-block;
            margin: 0;
            font-weight: 500;
        }

        .filter-section select {
            flex: 1;
            min-width: 150px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1em;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--accent);
        }

        tr:hover {
            background: var(--bg-primary);
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
        }

        .stat-label {
            color: var(--text-secondary);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧙‍♂️ MTG Tournament Tracker</h1>
            <p class="subtitle">Magic: The Gathering standings powered by Google Sheets</p>
        </header>

        <div class="filter-section">
            <label for="weekFilter">Filter by Week:</label>
            <select id="weekFilter">
                <option value="">All Weeks</option>
            </select>
            <label for="storeFilter">Filter by Store:</label>
            <select id="storeFilter">
                <option value="">All Stores</option>
            </select>
        </div>

        <h2>Leaderboard</h2>
        <div class="table-container">
            <table id="leaderboard">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player Name</th>
                        <th>Record</th>
                        <th>Points</th>
                        <th>Week</th>
                        <th>Store</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <h2>Top Performers</h2>
        <div class="table-container">
            <table id="topPerformers">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Total Points</th>
                        <th>Tournaments</th>
                        <th>Avg Points</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="stat-card">
            <div class="stat-label">Data Statistics</div>
            <div style="margin-top: 10px;">
                <p>Total Entries: <span id="totalEntries">0</span></p>
                <p>Unique Players: <span id="uniquePlayers">0</span></p>
                <p>Weeks Tracked: <span id="weeksTracked">0</span></p>
                <p>Stores: <span id="storesTracked">0</span></p>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOkGiNMBgwOUjZ_5JBWd3xfEfwBiPwagygbDBi0EVAIqxvP7Dr1ntpiiYvhWdeyK1y/exec';

        async function loadData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const rows = await response.json();
                renderDashboard(rows);
                populateFilters(rows);
                updateStatistics(rows);
            } catch (error) {
                console.error('Error loading data:', error);
                document.querySelector('#leaderboard tbody').innerHTML = 
                    '<tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">Error loading data</td></tr>';
            }
        }

        function renderDashboard(rows) {
            if (rows.length <= 1) {
                document.querySelector('#leaderboard tbody').innerHTML = 
                    '<tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">No data yet</td></tr>';
                document.querySelector('#topPerformers tbody').innerHTML = 
                    '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No data yet</td></tr>';
                return;
            }

            const weekFilter = document.getElementById('weekFilter').value;
            const storeFilter = document.getElementById('storeFilter').value;

            let filteredRows = rows.slice(1).map((row, idx) => ({
                name: row[0] || '',
                record: row[1] || '',
                points: parseInt(row[2]) || 0,
                week: row[3] || '',
                store: row[4] || ''
            }));

            if (weekFilter) {
                filteredRows = filteredRows.filter(r => r.week === weekFilter);
            }
            if (storeFilter) {
                filteredRows = filteredRows.filter(r => r.store === storeFilter);
            }

            filteredRows.sort((a, b) => b.points - a.points);

            const tbody = document.querySelector('#leaderboard tbody');
            tbody.innerHTML = filteredRows.map((row, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${row.name}</td>
                    <td>${row.record}</td>
                    <td><strong>${row.points}</strong></td>
                    <td>${row.week}</td>
                    <td>${row.store}</td>
                </tr>
            `).join('');

            const playerStats = {};
            rows.slice(1).forEach(row => {
                const name = row[0];
                const points = parseInt(row[2]) || 0;
                if (!playerStats[name]) {
                    playerStats[name] = { total: 0, count: 0 };
                }
                playerStats[name].total += points;
                playerStats[name].count += 1;
            });

            const topPerformers = Object.entries(playerStats)
                .map(([name, stats]) => ({
                    name,
                    total: stats.total,
                    count: stats.count,
                    avg: (stats.total / stats.count).toFixed(1)
                }))
                .sort((a, b) => b.total - a.total)
                .slice(0, 10);

            const topTbody = document.querySelector('#topPerformers tbody');
            topTbody.innerHTML = topPerformers.map((player, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${player.name}</td>
                    <td><strong>${player.total}</strong></td>
                    <td>${player.count}</td>
                    <td>${player.avg}</td>
                </tr>
            `).join('');
        }

        function populateFilters(rows) {
            const weeks = new Set(rows.slice(1).map(r => r[3]).filter(Boolean));
            const stores = new Set(rows.slice(1).map(r => r[4]).filter(Boolean));

            const weekSelect = document.getElementById('weekFilter');
            const currentWeek = weekSelect.value;
            weekSelect.innerHTML = '<option value="">All Weeks</option>' + 
                Array.from(weeks).sort().reverse().map(w => 
                    `<option value="${w}">${w}</option>`
                ).join('');
            weekSelect.value = currentWeek;

            const storeSelect = document.getElementById('storeFilter');
            const currentStore = storeSelect.value;
            storeSelect.innerHTML = '<option value="">All Stores</option>' + 
                Array.from(stores).sort().map(s => 
                    `<option value="${s}">${s}</option>`
                ).join('');
            storeSelect.value = currentStore;
        }

        function updateStatistics(rows) {
            const dataRows = rows.slice(1);
            const uniquePlayers = new Set(dataRows.map(r => r[0])).size;
            const weeks = new Set(dataRows.map(r => r[3])).size;
            const stores = new Set(dataRows.map(r => r[4])).size;

            document.getElementById('totalEntries').textContent = dataRows.length;
            document.getElementById('uniquePlayers').textContent = uniquePlayers;
            document.getElementById('weeksTracked').textContent = weeks;
            document.getElementById('storesTracked').textContent = stores;
        }

        document.getElementById('weekFilter').addEventListener('change', () => loadData());
        document.getElementById('storeFilter').addEventListener('change', () => loadData());

        window.addEventListener('load', () => {
            loadData();
        });

        setInterval(() => {
            loadData();
        }, 30000);
    </script>
</body>
</html>
