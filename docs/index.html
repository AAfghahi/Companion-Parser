<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorado Pauper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border: #e0e0e0;
            --accent: #6366f1;
            --success: #10b981;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --text-primary: #ffffff;
                --text-secondary: #b0b0b0;
                --border: #404040;
                --accent: #818cf8;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .filter-section {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-section label {
            display: inline-block;
            margin: 0;
            font-weight: 500;
        }

        .filter-section select,
        .filter-section input {
            flex: 1;
            min-width: 150px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1em;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filter-section input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .filter-section input::placeholder {
            color: var(--text-secondary);
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--accent);
        }

        tr:hover {
            background: var(--bg-primary);
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
        }

        .stat-label {
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .pagination-controls button {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.95em;
        }

        .pagination-controls button:hover:not(:disabled) {
            background-color: var(--accent);
            color: white;
        }

        .pagination-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧙‍♂️ Colorado Pauper</h1>
            <p class="subtitle">Current season standings powered by Google Sheets</p>
            <div style="margin-top: 15px; display: flex; gap: 15px;">
                <a href="season-history.html" style="color: var(--accent); text-decoration: none; font-weight: 500;">View Past Seasons →</a>
            </div>

        </header>

        <h2>Weekly Scores</h2>
        <div class="filter-section">
            <label for="weekFilter">Week:</label>
            <select id="weekFilter">
                <option value="">Loading...</option>
            </select>
            <label for="searchPlayer">Search Player:</label>
            <input type="text" id="searchPlayer" placeholder="Start typing a player name..." list="playerNames" autocomplete="off">
            <datalist id="playerNames"></datalist>
        </div>

        <div class="table-container">
            <table id="leaderboard">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player Name</th>
                        <th>Points</th>
                        <th>Record</th>
                        <th>OMW%</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="pagination-controls" style="text-align: center; margin: 20px 0; display: none;" id="paginationControls">
            <button id="prevPage">← Previous</button>
            <span id="pageInfo" style="margin: 0 15px; font-weight: bold;"></span>
            <button id="nextPage">Next →</button>
        </div>

        <h2>Leaderboard</h2>
        <div class="table-container">
            <table id="topPerformers">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Total Points</th>
                        <th>Tournaments</th>
                        <th>Avg Points</th>
                        <th>OMW%</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="pagination-controls" style="text-align: center; margin: 20px 0; display: none;" id="leaderboardPaginationControls">
            <button id="leaderboardPrevPage">← Previous</button>
            <span id="leaderboardPageInfo" style="margin: 0 15px; font-weight: bold;"></span>
            <button id="leaderboardNextPage">Next →</button>
        </div>

        <div class="stat-card">
            <div class="stat-label">Data Statistics</div>
            <div style="margin-top: 10px;">
                <p>Total Entries: <span id="totalEntries">0</span></p>
                <p>Unique Players: <span id="uniquePlayers">0</span></p>
                <p>Weeks Tracked: <span id="weeksTracked">0</span></p>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiVH_4CPYMiKyL5CBrvLWk40flxccReKSt6q9ClZcN2xztAn_6IrCn6wIEwjArPgnlZQ/exec';
        const CACHE_DURATION = 5 * 60 * 1000; // 5 minutes in milliseconds

        function getCacheKey(key) {
            return `mtg_cache_${key}`;
        }

        function getCache(key) {
            try {
                const cached = localStorage.getItem(getCacheKey(key));
                if (!cached) return null;
                const { data, timestamp } = JSON.parse(cached);
                if (Date.now() - timestamp > CACHE_DURATION) {
                    localStorage.removeItem(getCacheKey(key));
                    return null;
                }
                return data;
            } catch (e) {
                return null;
            }
        }

        function setCache(key, data) {
            try {
                localStorage.setItem(getCacheKey(key), JSON.stringify({
                    data,
                    timestamp: Date.now()
                }));
            } catch (e) {
                console.warn('Failed to cache data:', e);
            }
        }

        function formatDate(dateValue) {
            if (!dateValue) return '';

            // If it's already in M/D/YY format, return as-is
            if (typeof dateValue === 'string' && /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(dateValue)) {
                return dateValue;
            }

            // If it's an ISO string or timestamp, parse it
            let date;
            if (typeof dateValue === 'string' && dateValue.includes('T')) {
                date = new Date(dateValue);
            } else if (typeof dateValue === 'number') {
                date = new Date(dateValue);
            } else if (dateValue instanceof Date) {
                date = dateValue;
            } else {
                return String(dateValue);
            }

            if (isNaN(date.getTime())) return String(dateValue);

            const month = date.getMonth() + 1;
            const day = date.getDate();
            const year = date.getFullYear().toString().slice(-2);
            return `${month}/${day}/${year}`;
        }

        let allRowsData = [];
        let currentWeeklyPage = 1;
        let currentLeaderboardPage = 1;
        const itemsPerPage = 10;
        let lastLeaderboardData = [];

        async function loadData() {
            // Try to load from cache first
            const cached = getCache('standings');
            if (cached) {
                console.log('Loading standings from cache');
                allRowsData = cached;
                populateFilters(cached);
                renderDashboard();
                updateStatistics(cached);
                loadSeasonLink(); // Still load season link info
                return;
            }

            try {
                const response = await fetch(SCRIPT_URL);
                const rows = await response.json();
                setCache('standings', rows);
                allRowsData = rows;
                populateFilters(rows);
                renderDashboard();
                updateStatistics(rows);
                loadSeasonLink();
            } catch (error) {
                console.error('Error loading data:', error);
                // Try to use stale cache if available
                const staleCache = localStorage.getItem(getCacheKey('standings'));
                if (staleCache) {
                    try {
                        const { data } = JSON.parse(staleCache);
                        allRowsData = data;
                        renderDashboard();
                        populateFilters(data);
                        updateStatistics(data);
                        loadSeasonLink();
                        return;
                    } catch (e) {}
                }
                document.querySelector('#leaderboard tbody').innerHTML =
                    '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">Error loading data</td></tr>';
            }
        }

        async function loadSeasonLink() {
            try {
                const cached = getCache('seasons');
                let seasons = cached;

                if (!seasons) {
                    const seasonsResponse = await fetch(SCRIPT_URL + '?listSeasons=true');
                    seasons = await seasonsResponse.json();
                    if (Array.isArray(seasons) && typeof seasons[0] === 'string') {
                        setCache('seasons', seasons);
                    }
                }

                if (Array.isArray(seasons) && typeof seasons[0] === 'string') {
                    const historicalSeasons = seasons.filter(s => s !== 'MTG Standings');
                    const seasonLink = document.querySelector('a[href="season-history.html"]');
                    if (seasonLink) {
                        seasonLink.style.display = historicalSeasons.length > 0 ? 'inline-block' : 'none';
                    }
                }
            } catch (e) {
                // If we can't load seasons, hide the link to be safe
                const seasonLink = document.querySelector('a[href="season-history.html"]');
                if (seasonLink) {
                    seasonLink.style.display = 'none';
                }
            }
        }

        function renderDashboard() {
            if (allRowsData.length <= 1) {
                document.querySelector('#leaderboard tbody').innerHTML =
                    '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No data yet</td></tr>';
                document.querySelector('#topPerformers tbody').innerHTML =
                    '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No data yet</td></tr>';
                return;
            }

            const weekFilter = document.getElementById('weekFilter').value;
            const searchTerm = document.getElementById('searchPlayer').value.toLowerCase();

            // Build weekly scores data (individual tournament results)
            let weeklyScoresData = [];
            if (weekFilter) {
                allRowsData.slice(1).forEach(row => {
                    const name = row[0];
                    const record = row[1];
                    const points = parseInt(row[2]) || 0;
                    const week = row[3] || '';
                    const omw = row[4] ? parseFloat(row[4]) : null;

                    if (week === weekFilter) {
                        weeklyScoresData.push({
                            name,
                            record,
                            points,
                            omw: omw || 'N/A',
                            week
                        });
                    }
                });

                weeklyScoresData.sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    const aOmw = typeof a.omw === 'number' ? a.omw : 0;
                    const bOmw = typeof b.omw === 'number' ? b.omw : 0;
                    return bOmw - aOmw;
                });
            }

            // Build aggregated leaderboard data (totals across all weeks)
            const playerStats = {};
            allRowsData.slice(1).forEach(row => {
                const name = row[0];
                const points = parseInt(row[2]) || 0;
                const omw = row[4] ? parseFloat(row[4]) : null;

                if (!playerStats[name]) {
                    playerStats[name] = { total: 0, count: 0, omwValues: [] };
                }
                playerStats[name].total += points;
                playerStats[name].count += 1;
                if (omw !== null) {
                    playerStats[name].omwValues.push(omw);
                }
            });

            let leaderboardData = Object.entries(playerStats)
                .map(([name, stats]) => ({
                    name,
                    total: stats.total,
                    count: stats.count,
                    avg: Math.round(stats.total / stats.count),
                    avgOmw: stats.omwValues.length > 0 ? (stats.omwValues.reduce((a, b) => a + b, 0) / stats.omwValues.length).toFixed(1) : 'N/A'
                }))
                .sort((a, b) => {
                    if (b.total !== a.total) return b.total - a.total;
                    const aOmw = parseFloat(a.avgOmw) || 0;
                    const bOmw = parseFloat(b.avgOmw) || 0;
                    return bOmw - aOmw;
                });

            // Apply search filter to weekly scores and leaderboard
            if (searchTerm) {
                weeklyScoresData = weeklyScoresData.filter(p => p.name.toLowerCase().includes(searchTerm));
                leaderboardData = leaderboardData.filter(p => p.name.toLowerCase().includes(searchTerm));
            }

            currentWeeklyPage = 1;
            currentLeaderboardPage = 1;
            lastLeaderboardData = leaderboardData;
            renderLeaderboardPage(weeklyScoresData, weekFilter);
            renderLeaderboardTable(leaderboardData);
        }

        function renderLeaderboardPage(weeklyScoresData, weekFilter) {
            const start = (currentWeeklyPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = weeklyScoresData.slice(start, end);

            const tbody = document.querySelector('#leaderboard tbody');
            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">No players found</td></tr>';
            } else {
                tbody.innerHTML = pageData.map((player, idx) => `
                    <tr>
                        <td>${start + idx + 1}</td>
                        <td>${player.name}</td>
                        <td><strong>${player.points}</strong></td>
                        <td>${player.record}</td>
                        <td>${typeof player.omw === 'number' ? player.omw.toFixed(1) : player.omw}%</td>
                    </tr>
                `).join('');
            }

            const totalPages = Math.ceil(weeklyScoresData.length / itemsPerPage);
            const paginationControls = document.getElementById('paginationControls');

            if (weeklyScoresData.length > itemsPerPage) {
                paginationControls.style.display = 'block';
                document.getElementById('pageInfo').textContent = `Page ${currentWeeklyPage} of ${totalPages}`;
                document.getElementById('prevPage').disabled = currentWeeklyPage === 1;
                document.getElementById('nextPage').disabled = currentWeeklyPage === totalPages;
            } else {
                paginationControls.style.display = 'none';
            }
        }

        function renderLeaderboardTable(leaderboardData) {
            const start = (currentLeaderboardPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = leaderboardData.slice(start, end);

            const leaderboardTbody = document.querySelector('#topPerformers tbody');

            if (pageData.length === 0) {
                leaderboardTbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">No data yet</td></tr>';
            } else {
                leaderboardTbody.innerHTML = pageData.map((player, idx) => `
                    <tr>
                        <td>${start + idx + 1}</td>
                        <td>${player.name}</td>
                        <td><strong>${player.total}</strong></td>
                        <td>${player.count}</td>
                        <td>${player.avg}</td>
                        <td>${player.avgOmw}</td>
                    </tr>
                `).join('');
            }

            const totalPages = Math.ceil(leaderboardData.length / itemsPerPage);
            const leaderboardPaginationControls = document.getElementById('leaderboardPaginationControls');

            if (leaderboardData.length > itemsPerPage) {
                leaderboardPaginationControls.style.display = 'block';
                document.getElementById('leaderboardPageInfo').textContent = `Page ${currentLeaderboardPage} of ${totalPages}`;
                document.getElementById('leaderboardPrevPage').disabled = currentLeaderboardPage === 1;
                document.getElementById('leaderboardNextPage').disabled = currentLeaderboardPage === totalPages;
            } else {
                leaderboardPaginationControls.style.display = 'none';
            }
        }

        function populateFilters(rows) {
            const weeks = Array.from(new Set(rows.slice(1).map(r => r[3]).filter(Boolean))).sort().reverse();

            const weekSelect = document.getElementById('weekFilter');
            weekSelect.innerHTML = weeks.map(w =>
                `<option value="${w}">${formatDate(w)}</option>`
            ).join('');

            // Default to most recent week
            if (weeks.length > 0) {
                weekSelect.value = weeks[0];
            }

            const playerNames = new Set(rows.slice(1).map(r => r[0]).filter(Boolean));
            const datalist = document.getElementById('playerNames');
            datalist.innerHTML = Array.from(playerNames).sort().map(name =>
                `<option value="${name}"></option>`
            ).join('');
        }

        function updateStatistics(rows) {
            const dataRows = rows.slice(1);
            const uniquePlayers = new Set(dataRows.map(r => r[0])).size;
            const weeks = new Set(dataRows.map(r => r[3])).size;

            document.getElementById('totalEntries').textContent = dataRows.length;
            document.getElementById('uniquePlayers').textContent = uniquePlayers;
            document.getElementById('weeksTracked').textContent = weeks;
        }

        document.getElementById('weekFilter').addEventListener('change', () => renderDashboard());
        document.getElementById('searchPlayer').addEventListener('input', () => renderDashboard());

        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentWeeklyPage > 1) {
                currentWeeklyPage--;
                renderDashboard();
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            currentWeeklyPage++;
            renderDashboard();
        });

        document.getElementById('leaderboardPrevPage').addEventListener('click', () => {
            if (currentLeaderboardPage > 1) {
                currentLeaderboardPage--;
                renderLeaderboardTable(lastLeaderboardData);
            }
        });

        document.getElementById('leaderboardNextPage').addEventListener('click', () => {
            currentLeaderboardPage++;
            renderLeaderboardTable(lastLeaderboardData);
        });

        window.addEventListener('load', () => {
            loadData();
        });

        setInterval(() => {
            loadData();
        }, CACHE_DURATION);
    </script>
</body>
</html>
