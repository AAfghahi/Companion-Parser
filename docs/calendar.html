<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorado Pauper - Calendar</title>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></link>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border: #e0e0e0;
            --accent: #6366f1;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --text-primary: #ffffff;
                --text-secondary: #b0b0b0;
                --border: #404040;
                --accent: #818cf8;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-header {
            background-color: var(--bg-secondary);
            border-bottom: 2px solid var(--border);
            margin: -20px -20px 30px -20px;
            padding: 0;
        }

        .nav-tabs {
            display: flex;
            gap: 0;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
            list-style: none;
        }

        .nav-tabs li {
            margin: 0;
        }

        .nav-tabs a {
            display: block;
            padding: 16px 24px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .nav-tabs a:hover {
            background-color: var(--bg-primary);
            border-bottom-color: var(--accent);
        }

        .nav-tabs a.active {
            border-bottom-color: var(--accent);
            color: var(--accent);
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .content {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 8px;
        }

        #calendar {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .fc {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .fc .fc-button-primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .fc .fc-button-primary:hover {
            background-color: var(--accent);
            opacity: 0.9;
        }

        .fc .fc-button-primary.fc-button-active {
            background-color: var(--accent);
        }

        .fc .fc-daygrid-day {
            background-color: var(--bg-primary);
        }

        .fc .fc-daygrid-day.fc-day-other {
            background-color: var(--bg-secondary);
        }

        .fc .fc-daygrid-day:hover {
            background-color: var(--bg-secondary);
        }

        .fc .fc-event {
            cursor: pointer;
            border: none;
            padding: 2px 4px;
            font-size: 0.85em;
        }

        .fc-event-title {
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: var(--bg-primary);
            margin: 5% auto;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            font-weight: bold;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .event-info {
            margin-bottom: 15px;
        }

        .event-info-label {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .event-info-value {
            color: var(--text-primary);
            margin-left: 10px;
        }
    </style>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
</head>
<body>
    <nav class="nav-header">
        <ul class="nav-tabs">
            <li><a href="index.html">🧙‍♂️ Current Season</a></li>
            <li><a href="season-history.html">Past Seasons</a></li>
            <li><a href="rules.html">Rules</a></li>
            <li><a href="calendar.html" class="active">Calendar</a></li>
        </ul>
    </nav>

    <div class="container">
        <header>
            <h1>🧙‍♂️ Colorado Pauper - Calendar</h1>
            <p class="subtitle">Weekly tournament schedule across Colorado</p>
        </header>

        <div class="content">
            <div id="calendar"></div>
        </div>
    </div>

    <div id="eventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="eventTitle"></h2>
                <button class="modal-close" onclick="closeEventModal()">×</button>
            </div>
            <div id="eventDetails"></div>
        </div>
    </div>

    <script>
        const events = [
            // Metro Denver - Monday
            { title: 'Pauper @ MeH Games', day: 'MO', time: '19:00', location: 'MeH Games', address: 'Greenwood Village', region: 'Metro Denver' },
            // Metro Denver - Tuesday
            { title: 'Pauper @ Enchanted Grounds', day: 'TU', time: '19:00', location: 'Enchanted Grounds', address: 'Highlands Ranch', region: 'Metro Denver' },
            // Metro Denver - Wednesday
            { title: 'Pauper @ All C\'s', day: 'WE', time: '19:00', location: 'All C\'s', address: 'Aurora', region: 'Metro Denver' },
            // Metro Denver - Thursday
            { title: 'Pauper @ Mythic Games', day: 'TH', time: '18:30', location: 'Mythic Games', address: 'Littleton', region: 'Metro Denver' },
            // Metro Denver - Sunday
            { title: 'Pauper @ Denver Central Games', day: 'SU', time: '13:00', location: 'Denver Central Games', address: 'Denver', region: 'Metro Denver' },
            // Other locations - Monday
            { title: 'Pauper @ Card Cosmos', day: 'MO', time: '18:30', location: 'Card Cosmos', address: 'Colorado Springs', region: 'Other Locations' },
            // Other locations - Wednesday
            { title: 'Pauper @ Grandmaster Games', day: 'WE', time: '19:00', location: 'Grandmaster Games', address: 'Boulder', region: 'Other Locations' },
            // Other locations - Friday
            { title: 'Pauper @ Foxfire Games', day: 'FR', time: '18:00', location: 'Foxfire Games', address: 'Fort Collins', region: 'Other Locations' }
        ];

        const dayMap = { 'MO': 1, 'TU': 2, 'WE': 3, 'TH': 4, 'FR': 5, 'SU': 0 };

        const calendarEvents = events.map(event => {
            const dayOfWeek = dayMap[event.day];
            return {
                title: event.title,
                daysOfWeek: [dayOfWeek],
                startTime: event.time,
                endTime: addMinutes(event.time, 120),
                extendedProps: {
                    location: event.location,
                    address: event.address,
                    region: event.region,
                    time: event.time
                }
            };
        });

        function addMinutes(timeStr, minutes) {
            const [hours, mins] = timeStr.split(':').map(Number);
            const totalMins = hours * 60 + mins + minutes;
            const newHours = Math.floor(totalMins / 60) % 24;
            const newMins = totalMins % 60;
            return `${String(newHours).padStart(2, '0')}:${String(newMins).padStart(2, '0')}`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'timeGridWeek,listWeek'
                },
                events: calendarEvents,
                eventClick: function(info) {
                    showEventModal(info.event);
                },
                slotLabelFormat: {
                    meridiem: 'short'
                }
            });
            calendar.render();
        });

        function showEventModal(event) {
            const title = event.title;
            const location = event.extendedProps.location;
            const address = event.extendedProps.address;
            const region = event.extendedProps.region;
            const time = event.extendedProps.time;

            document.getElementById('eventTitle').textContent = title;
            document.getElementById('eventDetails').innerHTML = `
                <div class="event-info">
                    <div class="event-info-label">Time</div>
                    <div class="event-info-value">${time}</div>
                </div>
                <div class="event-info">
                    <div class="event-info-label">Location</div>
                    <div class="event-info-value">${location}</div>
                </div>
                <div class="event-info">
                    <div class="event-info-label">Address</div>
                    <div class="event-info-value">${address}</div>
                </div>
                <div class="event-info">
                    <div class="event-info-label">Region</div>
                    <div class="event-info-value">${region}</div>
                </div>
            `;
            document.getElementById('eventModal').style.display = 'block';
        }

        function closeEventModal() {
            document.getElementById('eventModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('eventModal');
            if (event.target === modal) {
                closeEventModal();
            }
        }
    </script>
</body>
</html>
